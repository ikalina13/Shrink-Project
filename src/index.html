<!doctype html>
<meta name="viewport"
content="width=device-width">
<style>
    body{margin:0;background:#111;color:#fff;font:16px monospace;text-align:center}
    canvas{display:block;margin:1 0px auto;background:#222;border:2px solid
    #555}
    button{padding:8px 16px}
</style>

<h3>SHRINK SNEKK</h3>
<div>Score: <b id="s">0</b> | Shrink: <b id="t">5.0</b></div>
<canvas id="c" width="400" height="400"></canvas>
<button onclick="location.reload()">Restart</button>

<script>
    c.width=c.height=400;
    x=c.getContext("2d");

    let n=20, z=20;
    let a=[[10,10]],d=[1,0],f=F();
    let score=0, last=Date.now(),over=0;

    function F(){
        let p;
        do p=[Math.random()*n|0,Math.random()*n|0];
        while(a.some(q=>q+""==p+""));
        return p;
        
    }

onkeydown=e=>{
    let k=e.key;
    let D={
        ArrowUp:[0,-1],
        ArrowDown:[0,1],
        ArrowLeft:[-1,0],
        ArrowRight:[1,0]
    }[k];

    if(D && D[0]+d[0] || D && D[1]+d[1]) d=D;
}

function game(){
    if(over)return;

    let now=Date.now();

    if(now-last>=5000){
        n=Math.max(6,n-2);
        a=a.filter(q=>q[0]>0&&q[0]<n-1&&q[1]>0&&q[1]<n-1);
        f=F();
        last=now;
    }

    let h=[
        a[0][0]+d[0],
        a[0][1]+d[1]
    ];

    if(
        h[0]<=0||h[1]<=0||
        h[0]>=n-1||h[1]>=n-1||
        a.some(q=>q[0]==h[0]&&q[1]==h[1])
    )return over=1;

    a.unshift(h);

    if(h+""==f+""){
        score++;
        s.textContent=score;
        f=F();
        last=now;
    }else{
        a.pop();
    }

    draw();
    t.textContent=((5000-now+last)/1000).toFixed(1);
}
function draw(){
    x.clearRect(0,0,400,400);
    x.fillStyle="#e33";
    x.fillRect(f[0]*z,f[1]*z,z,z);
    x.fillStyle="#5f5";
    a.forEach(q=>x.fillRect(q[0]*z,q[1]*z,z-2,z-2));
    x.strokeStyle="#777";
    x.strokeRect(0,0,n*z,n*z);
}

setInterval(game,100);
draw();
</script>
