<!doctype html>
<meta name="viewport"
content="width=device-width">
<style>
    body{margin:0;background:#111;color:#fff;font:16px monospace;text-align:center}
    canvas{display:block;margin:1 0px auto;background:#222;border:2px solid
    #555}
    button{padding:8px 16px}
</style>

<h3>SHRINK SNEKK</h3>
<div>Score: <b id="s">0</b> | Shrink: <b id="t">5.0</b></div>
<canvas id="c" width="400" height="400"></canvas>
<button onclick="location.reload()">Restart</button>

<script>
let c=document.getElementById("c"),x=c.getContext("2d");
let s=document.getElementById("s"),t=document.getElementById("t");

let size=20,cell=20;
let snekk=[[10,10]],dir=[1,0],apple;
let points=0,last=Date.now(),gameOver=false;
let audio=new AudioContext();

function newApple(){
    do apple=[
        1+Math.random()*(size-2)|0,
        1+Math.random()*(size-2)|0
    ];
    while(snekk.some(p=>p[0]==apple[0]&&p[1]==apple[1]));
}

newApple();

onkeydown=e=>{
    let D={
        ArrowUp:[0,-1],
        ArrowDown:[0,1],
        ArrowLeft:[-1,0],
        ArrowRight:[1,0]
    }[e.key];

    if(D&&(D[0]+dir[0]||D[1]+dir[1])){
        dir=D;
        e.preventDefault();
    }
};

function eatSound(){
    audio.resume();
    let beep=audio.createOscillator();
    let volume=audio.createGain();

    beep.connect(volume);
    volume.connect(audio.destination);

    beep.frequency.value=700;
    volume.gain.value=.05;
    beep.start();
    beep.stop(audio.currentTime+.08);
}

function game(){
    if(gameOver)return;

    let now=Date.now();

    if(now-last>=5000&&size>6){
        size-=2;
        last=now;

        snekk=snekk.filter(p=>
            p[0]>0&&p[0]<size-1&&
            p[1]>0&&p[1]<size-1
        );

        newApple();
    }

    let head=[
        snekk[0][0]+dir[0],
        snekk[0][1]+dir[1]
    ];

    let eating=head+""==apple+"";

    if(
        head[0]<=0||head[1]<=0||
        head[0]>=size-1||head[1]>=size-1||
        snekk.slice(0,eating?snekk.length:snekk.length-1)
        .some(p=>p[0]==head[0]&&p[1]==head[1])
    ){
        gameOver=true;
        return;
    }

    snekk.unshift(head);

    if(eating){
        points++;
        s.textContent=points;
        eatSound();
        newApple();
        last=now;
    }else{
        snekk.pop();
    }

    t.textContent=Math.max(0,(5000-now+last)/1000).toFixed(1);
    draw();
}

function draw(){
    x.clearRect(0,0,400,400);

    x.fillStyle="#e33";
    x.fillRect(apple[0]*cell,apple[1]*cell,cell,cell);

    x.fillStyle="#5f5";
    snekk.forEach(p=>
        x.fillRect(p[0]*cell,p[1]*cell,cell-2,cell-2)
    );

    x.strokeStyle="#777";
    x.strokeRect(0,0,size*cell,size*cell);
}

setInterval(game,100);
draw();
</script>
